[package]
name = "lidp"
version = "0.1.0"
description = "LIdP Tauri App"
authors = ["nathanfaucett@gmail.com"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lidp"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
yaml_serde = "0.10"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tower-service = "0.3"
axum = { version = "0.8" }
service = { path = "../../../crates/service", default-features = false, features = ["std"] }
model = { path = "../../../crates/model", default-features = false, features = ["std", "migrate"] }
db = { path = "../../../crates/db", default-features = false, features = ["migrate"] }
lidp-server = { path = "../../../crates/lidp-server", default-features = false, features = [] }
tauri-plugin-fetch-api = { path = "../../../crates/tauri-plugin-fetch-api" }
