[package]
name = "lidp"
version = "0.1.0"
description = "LIdP Tauri App"
authors = ["nathanfaucett@gmail.com"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lidp"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
yaml_serde = "0.10"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tower-service = "0.3"
axum = { version = "0.8" }

lidp-service = { path = "../../../crates/lidp-service", default-features = false, features = ["std"] }
lidp-model = { path = "../../../crates/lidp-model", default-features = false, features = ["std", "migrate"] }
db = { path = "../../../crates/db", default-features = false, features = ["migrate"] }
lidp-server = { path = "../../../crates/lidp-server", default-features = false, features = [] }

tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-cli = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = { version = "2", default-features = false, features = [] }
tauri-plugin-fetch-api = { path = "../../../crates/tauri-plugin-fetch-api" }
