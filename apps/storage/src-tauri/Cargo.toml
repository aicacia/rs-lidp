[package]
name = "storage"
version = "0.1.0"
description = "Local First Storage Tauri App"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "storage"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
yaml_serde = "0.10"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tower-service = "0.3"
axum = { version = "0.8" }

storage-server = { path = "../../../crates/storage-server", default-features = false, features = [] }

rcgen = { version = "0.14", default-features = false, features = ["ring"] }
iroh-relay = { version = "1.0", default-features = false, features = ["server", "tls-ring"] }
rustls = { version = "0.23", default-features = false, features = [] }

tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = { version = "2", default-features = false, features = [] }
tauri-plugin-fetch-api = { path = "../../../crates/tauri-plugin-fetch-api" }
