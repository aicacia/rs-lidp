[package]
name = "iroh-client-wasm"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Iroh Client for Web Assembly"

[lib]
name = "iroh_client_wasm"
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
# Iroh
iroh = { version = "1.0", default-features = false, features = [] }
iroh-tickets = {  version = "1.0", default-features = false, features = [] }
iroh-gossip = {  version = "0.101", default-features = false, features = ["net"] }

# Async
n0-future = { version =  "0.3", default-features = false, features = [] }

# Serialization
serde =  { version = "1.0", default-features = false, features = [] }
serde-wasm-bindgen =  { version = "0.6", default-features = false, features = [] }

# WASM
wasm-bindgen =  { version = "0.2", default-features = false, features = [] }
wasm-bindgen-futures =  { version = "0.4", default-features = false, features = [] }
wasm-streams = { version =  "0.5", default-features = false, features = [] }

# Tracing
tracing =  { version = "0.1", default-features = false, features = [] }
tracing-subscriber = { version = "0.3",default-features = false, features = ["env-filter"] }
tracing-subscriber-wasm =  { version = "0.1", default-features = false, features = [] }

# Utilities
thiserror = { version ="1.0", default-features = false, features = [] }
console_error_panic_hook = { version = "0.1", default-features = false, features = [] }
getrandom = { version = "0.3", default-features = false, features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-nontrapping-float-to-int", "--enable-bulk-memory"]
