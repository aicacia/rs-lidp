[package]
name = "model"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Local first models"

[lib]
name = "model"

[features]
default = ["std"]
std = ["serde/std", "serde_json/std", "chrono/std"]
utoipa = ["dep:utoipa", "std"]
axum = ["dep:axum"]
wasm = ["dep:tsify", "dep:serde-wasm-bindgen", "dep:wasm-bindgen"]


[dependencies]
# Web
utoipa = { version = "5.5", default-features = false, features = [
  "macros",
  "chrono",
], optional = true }
axum = { version = "0.8", default-features = false, features = [
  "json",
], optional = true }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = [] }

# Utilities
chrono = { version = "0.4", default-features = false, features = [
  "serde",
  "alloc",
] }
build-time = { version = "0.1", default-features = false }

# Optional TS generation + serde for tsify
tsify = { version = "0.5", default-features = false, features = [
  "js",
], optional = true }
serde-wasm-bindgen = { version = "0.6", default-features = false, optional = true }
wasm-bindgen = { version = "0.2", default-features = false, features = [
  "std",
], optional = true }

[dev-dependencies]
